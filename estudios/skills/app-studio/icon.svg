<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="App studio: telemóvel com um batimento cardíaco, uma lâmpada de ideia, um lápis e um estetoscópio">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#wobble)" stroke="#2B2B2B" stroke-linecap="round" stroke-linejoin="round">
    <!-- fundo -->
    <rect x="12" y="12" width="232" height="232" rx="52" fill="#ECE6FF" stroke-width="5"/>

    <!-- 💡 lâmpada (idear) -->
    <path d="M28 52 L22 52 M34 36 L30 32 M50 28 L50 22 M66 36 L70 32" fill="none" stroke="#E0A000" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="13" fill="#FFD43B" stroke-width="4"/>
    <rect x="43" y="62" width="14" height="9" rx="2" fill="#C9C9D6" stroke-width="3"/>

    <!-- telemóvel -->
    <rect x="82" y="30" width="92" height="178" rx="20" fill="#FFFFFF" stroke-width="6"/>
    <rect x="92" y="48" width="72" height="134" rx="8" fill="#DFF0FF" stroke-width="3"/>
    <path d="M116 39 L140 39" fill="none" stroke-width="4"/>
    <path d="M116 195 L140 195" fill="none" stroke-width="4"/>
    <!-- ecrã: cartão + batimento -->
    <rect x="100" y="58" width="56" height="16" rx="5" fill="#FFFFFF" stroke-width="2.5"/>
    <rect x="105" y="64" width="26" height="4" rx="2" fill="#B9B4D6" stroke="none"/>
    <path d="M97 118 L110 118 L116 100 L124 138 L132 90 L140 128 L146 118 L159 118" fill="none" stroke="#FF4D6D" stroke-width="5.5"/>
    <rect x="100" y="150" width="34" height="12" rx="6" fill="#8A63D2" stroke-width="2.5"/>

    <!-- 🩺 estetoscópio (diagnosticar) -->
    <path d="M196 34 L206 52 L218 32" fill="none" stroke-width="5"/>
    <circle cx="195" cy="31" r="4.5" fill="#2B2B2B" stroke="none"/>
    <circle cx="219" cy="29" r="4.5" fill="#2B2B2B" stroke="none"/>
    <path d="M206 52 C228 86 228 146 210 178" fill="none" stroke-width="6"/>
    <circle cx="202" cy="194" r="17" fill="#D9D9E3" stroke-width="6"/>
    <circle cx="202" cy="194" r="7" fill="#FFFFFF" stroke-width="3"/>

    <!-- ✏️ lápis (criar) -->
    <g transform="translate(84 196) rotate(-145) scale(.75)">
      <rect x="-8" y="-62" width="16" height="12" rx="3" fill="#FF8FA3" stroke-width="5"/>
      <rect x="-8" y="-50" width="16" height="7" fill="#C9C9D6" stroke-width="4"/>
      <rect x="-8" y="-43" width="16" height="63" fill="#FFD43B" stroke-width="5"/>
      <path d="M-8 20 L8 20 L0 38 Z" fill="#F6D7B0" stroke-width="5"/>
      <path d="M-3 29 L3 29 L0 38 Z" fill="#2B2B2B" stroke="none"/>
    </g>

    <!-- brilho -->
    <path d="M34 120 L37 128 L45 131 L37 134 L34 142 L31 134 L23 131 L31 128 Z" fill="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
