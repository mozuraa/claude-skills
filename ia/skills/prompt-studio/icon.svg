<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Prompt studio: um balão de conversa com uma prompt, uma lâmpada acesa e um lápis a escrever">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#wobble)" stroke="#2B2B2B" stroke-linecap="round" stroke-linejoin="round">
    <!-- fundo -->
    <rect x="12" y="12" width="232" height="232" rx="52" fill="#EFE7FF" stroke-width="5"/>

    <!-- rabiscos de fundo -->
    <path d="M44 34 L47 43 L56 46 L47 49 L44 58 L41 49 L32 46 L41 43 Z" fill="#FFD43B" stroke-width="3.5"/>
    <circle cx="112" cy="46" r="4.5" fill="none" stroke-width="3.5"/>
    <path d="M150 38 L150 52 M143 45 L157 45" fill="none" stroke-width="3.5"/>

    <!-- balão de conversa (a prompt) -->
    <path d="M54 74 H158 Q176 74 176 92 V156 Q176 174 158 174 H96 L58 204 L66 174 H54 Q36 174 36 156 V92 Q36 74 54 74 Z" fill="#FFFFFF" stroke-width="6"/>
    <path d="M52 98 L64 108 L52 118" fill="none" stroke="#FF6B4A" stroke-width="6.5"/>
    <path d="M76 108 L156 108" fill="none" stroke-width="5"/>
    <path d="M52 132 L144 132" fill="none" stroke-width="5"/>
    <path d="M52 154 L114 154" fill="none" stroke-width="5"/>
    <rect x="123" y="144" width="9" height="19" rx="2" fill="#3D7BFF" stroke="none"/>

    <!-- lâmpada (perceber a ideia) -->
    <path d="M206 28 L206 36 M182 41 L187 46 M229 42 L224 47 M234 66 L228 66" fill="none" stroke-width="4.5"/>
    <circle cx="206" cy="66" r="22" fill="#FFD43B" stroke-width="6"/>
    <path d="M199 72 Q202 61 206 71 Q210 61 213 72" fill="none" stroke-width="3.5"/>
    <rect x="197" y="87" width="18" height="14" rx="3" fill="#C9CDD6" stroke-width="4.5"/>
    <path d="M200 94 L212 94" fill="none" stroke-width="3"/>

    <!-- lápis a escrever -->
    <g transform="translate(190 186) rotate(-45)">
      <rect x="-28" y="-9" width="58" height="18" fill="#FFB84D" stroke-width="4.5"/>
      <rect x="30" y="-9" width="8" height="18" fill="#C9CDD6" stroke-width="4.5"/>
      <path d="M38 -9 L44 -9 Q48 -9 48 -5 L48 5 Q48 9 44 9 L38 9 Z" fill="#FF8FA3" stroke-width="4.5"/>
      <path d="M-28 -9 L-46 0 L-28 9 Z" fill="#FFE8C2" stroke-width="4.5"/>
      <path d="M-39 -3.5 L-46 0 L-39 3.5 Z" fill="#2B2B2B" stroke="none"/>
    </g>
    <path d="M104 220 Q112 212 120 220 T136 220 T150 218" fill="none" stroke="#3D7BFF" stroke-width="4"/>
  </g>
</svg>
